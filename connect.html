<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OshA • Developer Profile & Connect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Outfit:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: rgba(18, 24, 38, 0.85);
            --card-border: rgba(56, 139, 253, 0.25);
            --primary: #58a6ff;
            --whatsapp: #25d366;
            --facebook: #1877f2;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', 'Outfit', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image:
                radial-gradient(at 0% 0%, rgba(56, 139, 253, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(35, 134, 54, 0.12) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(137, 87, 229, 0.1) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-main);
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 38px 24px 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 139, 253, 0.1);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #58a6ff, #2ea043, transparent);
            animation: shine 4s infinite linear;
        }

        @keyframes shine {
            0% {
                left: -100%;
            }

            50%,
            100% {
                left: 100%;
            }
        }

        /* Language Switcher Badge */
        .lang-switch-box {
            position: absolute;
            top: 18px;
            left: 18px;
            z-index: 10;
        }

        [dir="ltr"] .lang-switch-box {
            left: auto;
            right: 18px;
        }

        .btn-lang {
            background: rgba(22, 27, 34, 0.85);
            border: 1px solid rgba(56, 139, 253, 0.35);
            color: #58a6ff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s ease;
            backdrop-filter: blur(8px);
        }

        .btn-lang:hover {
            background: rgba(56, 139, 253, 0.2);
            border-color: #58a6ff;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 139, 253, 0.3);
        }

        .btn-lang:active {
            transform: scale(0.95);
        }

        .avatar-wrap {
            position: relative;
            width: 96px;
            height: 96px;
            margin: 0 auto 16px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #1f6feb, #2ea043);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            box-shadow: 0 8px 25px rgba(31, 111, 235, 0.4);
            border: 3px solid rgba(255, 255, 255, 0.2);
        }

        .badge-online {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 18px;
            height: 18px;
            background-color: #3fb950;
            border: 3px solid #0d1117;
            border-radius: 50%;
        }

        [dir="ltr"] .badge-online {
            right: 4px;
            left: auto;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ffffff, #c9d1d9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 6px;
            font-family: 'Outfit', sans-serif;
            letter-spacing: 0.5px;
        }

        .description {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 26px;
            line-height: 1.6;
        }

        .links-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            border-radius: 16px;
            text-decoration: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid transparent;
        }

        .btn-link:active {
            transform: scale(0.98);
        }

        .btn-whatsapp {
            background: linear-gradient(135deg, #25d366, #128c7e);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.3);
            border-color: rgba(37, 211, 102, 0.5);
        }

        .btn-whatsapp:hover {
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.45);
            transform: translateY(-2px);
        }

        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            box-shadow: 0 6px 20px rgba(220, 39, 67, 0.3);
            border-color: rgba(220, 39, 67, 0.5);
        }

        .btn-instagram:hover {
            box-shadow: 0 8px 25px rgba(220, 39, 67, 0.45);
            transform: translateY(-2px);
        }

        .btn-facebook {
            background: linear-gradient(135deg, #1877f2, #0d5bb8);
            box-shadow: 0 6px 20px rgba(24, 119, 242, 0.3);
            border-color: rgba(24, 119, 242, 0.5);
        }

        .btn-facebook:hover {
            box-shadow: 0 8px 25px rgba(24, 119, 242, 0.45);
            transform: translateY(-2px);
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-icon {
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-arrow {
            font-size: 16px;
            opacity: 0.8;
            transition: transform 0.2s ease;
        }

        [dir="rtl"] .btn-link:hover .btn-arrow {
            transform: translateX(-5px);
        }

        [dir="ltr"] .btn-link:hover .btn-arrow {
            transform: translateX(5px);
        }

        .footer {
            margin-top: 28px;
            font-size: 11px;
            color: #484f58;
            font-family: 'Outfit', 'Cairo', sans-serif;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Language Switcher Button -->
        <div class="lang-switch-box">
            <button class="btn-lang" onclick="toggleLanguage()" id="btn-lang-toggle">
                <span>🌐</span>
                <span id="btn-lang-text">English</span>
            </button>
        </div>

        <!-- Avatar & Badge -->
        <div class="avatar-wrap">
            <div class="avatar">⚡</div>
            <div class="badge-online"></div>
        </div>

        <h1>OshA</h1>
        <div class="subtitle"> Automation Engineer • Developer </div>
        <p class="description" id="desc-text">تواصل معي مباشرة عبر القنوات الرسمية بالأسفل</p>

        <!-- Social Channels -->
        <div class="links-group">
            <!-- WhatsApp Button -->
            <a href="https://wa.me/iOshA" id="link-whatsapp" class="btn-link btn-whatsapp" target="_blank">
                <div class="btn-content">
                    <span class="btn-icon">💬</span>
                    <span id="txt-whatsapp">مراسلة عبر واتساب</span>
                </div>
                <span class="btn-arrow" id="arrow-wa">◀</span>
            </a>

            <!-- Instagram Button -->
            <a href="https://instagram.com/0shasc" id="link-instagram" class="btn-link btn-instagram" target="_blank">
                <div class="btn-content">
                    <span class="btn-icon">📸</span>
                    <span id="txt-instagram">حساب انستجرام</span>
                </div>
                <span class="btn-arrow" id="arrow-ig">◀</span>
            </a>

            <!-- Facebook Button -->
            <a href="https://facebook.com/0shASC" id="link-facebook" class="btn-link btn-facebook" target="_blank">
                <div class="btn-content">
                    <span class="btn-icon">📘</span>
                    <span id="txt-facebook">حساب الفيسبوك</span>
                </div>
                <span class="btn-arrow" id="arrow-fb">◀</span>
            </a>
        </div>

        <div class="footer" id="footer-text">
            © 2026 OshA Automation Tools • جميع الحقوق محفوظة
        </div>
    </div>

    <script>
        const TRANSLATIONS = {
            ar: {
                desc: "تواصل معي مباشرة عبر القنوات الرسمية بالأسفل",
                whatsapp: "مراسلة عبر واتساب",
                instagram: "حساب انستجرام",
                facebook: "حساب الفيسبوك",
                arrow: "◀",
                footer: "© 2026 OshA Automation Tools • جميع الحقوق محفوظة",
                btnText: "English"
            },
            en: {
                desc: "Connect with me directly via the official channels below",
                whatsapp: "Chat on WhatsApp",
                instagram: "Instagram Profile",
                facebook: "Facebook Profile",
                arrow: "▶",
                footer: "© 2026 OshA Automation Tools • All Rights Reserved",
                btnText: "العربية"
            }
        };

        const DEFAULT_CONFIG = {
            whatsapp: "iOshA",
            instagram: "iOshA",
            facebook: "iOshA"
        };

        const params = new URLSearchParams(window.location.search);
        const wa = params.get('wa') || params.get('whatsapp') || DEFAULT_CONFIG.whatsapp;
        const ig = params.get('ig') || params.get('instagram') || DEFAULT_CONFIG.instagram;
        const fb = params.get('fb') || params.get('facebook') || DEFAULT_CONFIG.facebook;

        if (wa) {
            const cleanWa = wa.replace(/[@]/g, '');
            document.getElementById('link-whatsapp').href = `https://wa.me/${cleanWa}`;
        }

        if (ig) {
            const cleanIg = ig.replace(/[@]/g, '');
            document.getElementById('link-instagram').href = cleanIg.startsWith('http') ? cleanIg : `https://instagram.com/${cleanIg}`;
        }

        if (fb) {
            document.getElementById('link-facebook').href = fb.startsWith('http') ? fb : `https://facebook.com/${fb}`;
        }

        function setLanguage(lang) {
            const t = TRANSLATIONS[lang] || TRANSLATIONS.ar;
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

            document.getElementById('desc-text').innerText = t.desc;
            document.getElementById('txt-whatsapp').innerText = t.whatsapp;
            document.getElementById('txt-instagram').innerText = t.instagram;
            document.getElementById('txt-facebook').innerText = t.facebook;
            document.getElementById('footer-text').innerText = t.footer;
            document.getElementById('btn-lang-text').innerText = t.btnText;

            document.getElementById('arrow-wa').innerText = t.arrow;
            document.getElementById('arrow-ig').innerText = t.arrow;
            document.getElementById('arrow-fb').innerText = t.arrow;

            try {
                localStorage.setItem('preferred_lang', lang);
            } catch (e) { }
        }

        function toggleLanguage() {
            const currentLang = document.documentElement.lang || 'ar';
            const nextLang = currentLang === 'ar' ? 'en' : 'ar';
            setLanguage(nextLang);
        }

        // Initialize language
        const initialLang = params.get('lang') || localStorage.getItem('preferred_lang') || 'ar';
        setLanguage(initialLang);
    </script>
</body>

</html>
